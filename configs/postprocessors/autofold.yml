postprocessor:
  name: autofold
  APS_mode: True
  postprocessor_args:
    alpha: 0.4               # fallback alpha (overwritten by calibration)
    norm: true               # score normalization on/off
    loco_max_classes: 20     # max held-out classes for calibration
  postprocessor_sweep:
    norm_list: [false, true]
