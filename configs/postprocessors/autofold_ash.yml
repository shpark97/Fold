postprocessor:
  name: autofold_ash
  APS_mode: True
  postprocessor_args:
    alpha: 0.4               # fallback alpha (overwritten by calibration)
    percentile: 90           # ASH pruning percentile
    norm: true               # score normalization on/off
    loco_max_classes: 20     # max held-out classes for calibration
  postprocessor_sweep:
    percentile_list: [65, 70, 75, 80, 85, 90, 95]
